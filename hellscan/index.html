// ---------- level generation ----------
function genLevel(n) {
  const th = THEMES[(n - 1) % THEMES.length], NR = 7, MH = 44, rooms = [];
  let x = 2, cy = MH >> 1;
  for (let i = 0; i < NR; i++) {
    const start = i === 0, boss = i === NR - 1;
    const w = start ? 7 : boss ? 15 : randi(10, 13), h = start ? 7 : boss ? 13 : randi(9, 12);
    if (i > 0) cy = clamp(cy + randi(-7, 7), (h >> 1) + 3, MH - (h >> 1) - 4);
    const y0 = cy - (h >> 1);
    const r = { i, x0: x, y0, w, h, start, boss };
    r.inRow = start ? cy : clamp(cy + randi(-1, 1), y0 + 1, y0 + h - 2);
    r.outRow = start ? cy : clamp(y0 + randi(1, h - 2), y0 + 1, y0 + h - 2);
    r.sx = start ? x + 3.5 : x + 1.5; r.sy = r.inRow + .5;
    rooms.push(r);
    x += w + randi(8, 10);
  }
  const MW = x + 2, map = new Uint8Array(MW * MH).fill(255), reg = new Int16Array(MW * MH);
  const carve = (cx, cy2, v) => {
    if (cx > 0 && cy2 > 0 && cx < MW - 1 && cy2 < MH - 1) { const k = cy2 * MW + cx; map[k] = 0; if (v >= 100 || reg[k] === 0) reg[k] = v; }
  };
  for (const r of rooms) for (let yy = r.y0; yy < r.y0 + r.h; yy++) for (let xx = r.x0; xx < r.x0 + r.w; xx++) carve(xx, yy, 100 + r.i);
  const paths = [];
  for (let i = 0; i < NR - 1; i++) {
    const a = rooms[i], b = rooms[i + 1], ax = a.x0 + a.w, bx = b.x0 - 1, xm = ax + ((bx - ax) >> 1);
    for (let xx = ax; xx <= xm + 1; xx++) for (let d = -1; d <= 1; d++) carve(xx, a.outRow + d, 1);
    const ylo = Math.min(a.outRow, b.inRow), yhi = Math.max(a.outRow, b.inRow);
    for (let yy = ylo - 1; yy <= yhi + 1; yy++) for (let d = -1; d <= 1; d++) carve(xm + d, yy, 1);
    for (let xx = xm - 1; xx <= bx; xx++) for (let d = -1; d <= 1; d++) carve(xx, b.inRow + d, 1);
    const pts = [];
    const push = (px, py) => { const l = pts[pts.length - 1]; if (!l || Math.abs(l.x - px) > .01 || Math.abs(l.y - py) > .01) pts.push({ x: px, y: py }); };
    push(a.x0 + a.w - 1.5, a.outRow + .5); push(xm + .5, a.outRow + .5); push(xm + .5, b.inRow + .5); push(b.sx, b.sy);
    paths.push(pts);
  }
  const pillars = new Set();
  for (const r of rooms) {
    if (r.start) continue;
    const cand = r.boss
      ? [[r.x0 + 4, r.y0 + 2], [r.x0 + 4, r.y0 + r.h - 3], [r.x0 + r.w - 4, r.y0 + 2], [r.x0 + r.w - 4, r.y0 + r.h - 3]]
      : Math.random() < .65 ? [[r.x0 + r.w - 3, r.y0 + 2], [r.x0 + r.w - 3, r.y0 + r.h - 3]] : [];
    for (const [px, py] of cand) {
      if (Math.abs(py - r.outRow) < 3 || Math.abs(py - r.inRow) < 2) continue;
      const k = py * MW + px;
      map[k] = 255; reg[k] = 0; pillars.add(k);
    }
  }
  const wallT = WID[th.wall], corrT = WID[th.corr], frameT = WID[th.frame], bossT = WID[th.boss];
  for (let yy = 0; yy < MH; yy++) for (let xx = 0; xx < MW; xx++) {
    const k = yy * MW + xx;
    if (map[k] === 0) continue;
    let room = -1, corr = false;
    for (const [ox, oy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const X = xx + ox, Y = yy + oy;
      if (X < 0 || Y < 0 || X >= MW || Y >= MH) continue;
      const rv = reg[Y * MW + X];
      if (rv >= 100) room = rv - 100; else if (rv === 1) corr = true;
    }
    map[k] = pillars.has(k) || (room >= 0 && corr) ? frameT : room >= 0 ? (rooms[room].boss ? bossT : wallT) : corr ? corrT : wallT;
  }
  const decor = [];
  for (const r of rooms) {
    const pos = r.start
      ? [[r.x0 + .7, r.y0 + .7], [r.x0 + r.w - .7, r.y0 + .7], [r.x0 + .7, r.y0 + r.h - .7], [r.x0 + r.w - .7, r.y0 + r.h - .7]]
      : [[r.x0 + r.w - .7, r.y0 + .7], [r.x0 + r.w - .7, r.y0 + r.h - .7]];
    for (const [dx, dy] of pos) {
      if (!r.start && Math.abs(dy - (r.outRow + .5)) < 2) continue;
      if (th.decor === 'sign') decor.push({ x: dx, y: dy, hgt: 1.15, frames: [SPR.sign[randi(0, SPR.sign.length - 1)]] });
      else if (th.decor === 'lamp') decor.push({ x: dx, y: dy, hgt: 1.05, frames: [SPR.lamp] });
      else decor.push({ x: dx, y: dy, hgt: .85, frames: SPR.torch });
    }
  }
  return { n, th, MW, MH, map, rooms, paths, decor, floor: FT[th.floor], ceil: FT[th.ceil], light: th.light };
}

// ---------- world queries ----------
function solidAt(x, y) {
  const L = G.lvl, ix = Math.floor(x), iy = Math.floor(y);
  if (ix < 0 || iy < 0 || ix >= L.MW || iy >= L.MH) return true;
  return L.map[iy * L.MW + ix] !== 0;
}
function solidAround(x, y, r) { return solidAt(x - r, y - r) || solidAt(x + r, y - r) || solidAt(x - r, y + r) || solidAt(x + r, y + r); }
function los(x0, y0, x1, y1) {
  const dx = x1 - x0, dy = y1 - y0, n = Math.ceil(Math.hypot(dx, dy) / .2);
  for (let i = 1; i < n; i++) if (solidAt(x0 + dx * i / n, y0 + dy * i / n)) return false;
  return true;
}
const bearing = (x, y) => angDiff(Math.atan2(y - cam.y, x - cam.x), G.faceA);
function findSpot(room, dmin, dmax) {
  let best = null, bs = -1;
  for (let i = 0; i < 48; i++) {
    const b = rand(-G.maxB, G.maxB), d = rand(dmin, dmax), a = G.faceA + b;
    const x = room.sx + Math.cos(a) * d, y = room.sy + Math.sin(a) * d;
    if (x < room.x0 + .7 || x > room.x0 + room.w - .7 || y < room.y0 + .7 || y > room.y0 + room.h - .7) continue;
    if (solidAround(x, y, .45) || !los(room.sx, room.sy, x, y)) continue;
    let sep = 3;
    for (const o of enemies) if (o.state !== 'dead' && o.state !== 'idle') sep = Math.min(sep, Math.abs(b - bearing(o.x, o.y)));
    for (const o of items) { sep = Math.min(sep, Math.abs(b - bearing(o.x, o.y))); if (Math.hypot(o.x - x, o.y - y) < 1.2) sep = -1; }
    const sc = sep + Math.random() * .02;
    if (sc > bs) { bs = sc; best = { x, y }; }
  }
  return best;
}

function update(dt) {

  for (let i = popups.length - 1; i >= 0; i--) if ((popups[i].t += dt) > .9) popups.splice(i, 1);
  for (let i = beams.length - 1; i >= 0; i--) if ((beams[i].t += dt) > .12) beams.splice(i, 1);

let sbuf = '', sTimer = 0, sMatchEnd = -1;

  if (sbuf.length - Math.max(0, sMatchEnd) >= DIGITS && activeHas(tail)) { sMatchEnd = sbuf.length; onScan(tail); }

}
function flush() {  // end of one scan (Enter/Tab or a pause in typing); leftovers after a match are scanner prefixes/suffixes

  }
  if (t.kind === 'menu') { if (!t.quiet) snd('menu'); t.act(); return; }
  const o = t.ref, r = t.rect;
  G.fireT = .15; G.muz = .07;
  beams.push({ x: (r[0] + r[2] / 2) / kx, y: (r[1] + r[3] / 2) / ky, t: 0 });
  snd('fire');

}
function keyChar(e) {

}
document.addEventListener('keydown', e => {
  S.unlock();
  const k = e.keyCode || e.which || 0;
  if (e.key === 'Escape' || k === 27) {
    if (G.mode === 'paused') resumeGame();
    else if (['intro', 'walk', 'fight', 'cleared'].includes(G.mode)) pauseGame();
    else if (G.mode === 'name') { if (recentPlayers().length) setMode('who'); else toTitle(); }
    else if (G.mode === 'title') toArcade();
    else if (G.mode !== 'loot') quitGame();
    return;
  }
  if (e.key === 'Enter' || e.key === 'Tab' || k === 13 || k === 9) { e.preventDefault(); flush(); return; }
  if (k === 229 || e.key === 'Unidentified' || e.key === 'Process') return;  // IME: text arrives via the input event

  const ch = keyChar(e);
  if (ch) { e.preventDefault(); feed(ch); }
}, true);
scanEl.addEventListener('input', () => {
  const v = scanEl.value;
  scanEl.value = '';
  for (const ch of v) { if (ch === '\n' || ch === '\r' || ch === '\t') flush(); else feed(ch); }
});
function focusScan() {
  if (document.activeElement !== scanEl) { try { scanEl.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
}
scanEl.addEventListener('blur', () => setTimeout(focusScan, 0));
setInterval(focusScan, 1500);
window.addEventListener('pointerdown', e => {
  S.unlock(); focusScan();
  const x = e.clientX * dpr, y = e.clientY * dpr;
  for (let i = G.targets.length - 1; i >= 0; i--) {
    const t = G.targets[i], r = t.rect;
    if (x >= r[0] && y >= r[1] && x < r[0] + r[2] && y < r[1] + r[3]) { if (t.kind === 'menu' || TOUCH_SHOOT) onScan(t.code.text); break; }
  }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) pauseGame(); else if (G.mode !== 'title') keepAwake();
});

// ---------- fullscreen / screen wake ----------
let wakeLock = null;
function keepAwake() {
  try {
    if (navigator.wakeLock && !wakeLock) navigator.wakeLock.request('screen').then(l => { wakeLock = l; l.addEventListener('release', () => { wakeLock = null; }); }).catch(() => {});
  } catch (e) { /* not supported */ }
}
function goFull() {
  if (NO_FS) return;
  try { const d = document.documentElement; if (!document.fullscreenElement && d.requestFullscreen) d.requestFullscreen({ navigationUI: 'hide' }).catch(() => {}); } catch (e) { /* not supported */ }
}

// ---------- sound (synthesised, no files) ----------
const S = {
  ctx: null, out: null, nb: null, on: true,
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      this.ctx = new AC();
      this.out = this.ctx.createGain(); this.out.gain.value = .5;
      const comp = this.ctx.createDynamicsCompressor();
      this.out.connect(comp); comp.connect(this.ctx.destination);
      const len = this.ctx.sampleRate | 0;
      this.nb = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.nb.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { this.ctx = null; }
  },
  unlock() { this.init(); if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); },
  tone(type, f0, f1, dur, vol, del = 0) {
    const c = this.ctx, t = c.currentTime + del, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g); g.connect(this.out); o.start(t); o.stop(t + dur + .02);
  },
  noise(dur, vol, ft, f0, f1, del = 0, q = 1) {
    const c = this.ctx, t = c.currentTime + del, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.nb; s.loop = true;
    f.type = ft; f.Q.value = q; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.out); s.start(t, Math.random() * .5); s.stop(t + dur + .02);
  },
};
function snd(n) {
  if (!S.on || !S.ctx || S.ctx.state !== 'running') return;
  try {
    switch (n) {
      case 'fire': S.tone('sawtooth', 1600, 180, .16, .22); S.noise(.22, .7, 'lowpass', 3000, 200); S.tone('sine', 120, 40, .18, .5); break;
      case 'pain': S.tone('square', 320, 120, .14, .18, .03); break;
      case 'bosspain': S.tone('sawtooth', 160, 70, .3, .3, .03); break;
      case 'die': S.tone('sawtooth', 260, 40, .5, .28, .04); S.noise(.4, .3, 'bandpass', 900, 150, .04, 2); break;
      case 'bossdie': S.tone('sawtooth', 140, 25, 1.4, .45); S.noise(1.2, .6, 'lowpass', 1500, 60); break;
      case 'spawn': S.tone('sine', 220, 900, .45, .12); S.tone('triangle', 440, 1800, .45, .06); break;
      case 'roar': S.tone('sawtooth', 110, 45, 1.2, .4); S.noise(1, .35, 'bandpass', 400, 120, 0, 3); break;
      case 'zshot': S.noise(.13, .45, 'highpass', 1800, 700); S.tone('square', 200, 80, .06, .12); break;
      case 'whiz': S.noise(.2, .12, 'bandpass', 4000, 1200, .04, 6); break;
      case 'fireball': S.noise(.5, .25, 'bandpass', 250, 1300, 0, 2); break;
      case 'claw': S.noise(.16, .55, 'bandpass', 2600, 500, 0, 1.5); break;
      case 'boom': S.noise(.9, 1, 'lowpass', 1400, 60); S.tone('sine', 90, 28, .7, .7); break;
      case 'pop': S.noise(.25, .4, 'lowpass', 2400, 200); break;
      case 'hurt': S.tone('square', 170, 85, .25, .25); S.noise(.12, .3, 'lowpass', 900, 300); break;
      case 'pdie': S.tone('sawtooth', 220, 40, 1.4, .35); S.tone('square', 110, 30, 1.4, .2); break;
      case 'pickup': S.tone('square', 660, 660, .07, .14); S.tone('square', 990, 990, .1, .14, .07); break;
      case 'clear': [523, 659, 784, 1046].forEach((f, i) => S.tone('square', f, f, .12, .12, i * .09)); break;
      case 'menu': S.tone('square', 880, 1320, .09, .14); break;
      case 'buzz': S.tone('sawtooth', 110, 100, .2, .18); break;
      case 'crate': [784, 1046, 1318].forEach((f, i) => S.tone('triangle', f, f, .14, .14, i * .07)); break;
      case 'loot': [523, 784, 1046, 1568].forEach((f, i) => S.tone('square', f, f * 1.01, .1, .1, i * .06)); S.noise(.4, .08, 'highpass', 6000, 3000, .1); break;
      case 'freeze': S.tone('sine', 2400, 300, .7, .16); S.noise(.6, .12, 'highpass', 5000, 1500); break;
      case 'slow': S.tone('sawtooth', 400, 80, .8, .12); break;
      case 'shield': S.tone('sine', 300, 600, .5, .2); S.tone('sine', 450, 900, .5, .12); break;
      case 'block': S.tone('triangle', 1600, 1200, .12, .15); break;
      case 'nuke': S.noise(2, 1, 'lowpass', 2500, 40); S.tone('sine', 70, 20, 1.6, .8); S.tone('sawtooth', 1200, 200, 1, .1); break;
      case 'revive': [392, 523, 659, 784, 1046].forEach((f, i) => S.tone('square', f, f, .14, .13, i * .08)); break;
      case 'pass': S.tone('square', 660, 660, .08, .12); S.tone('square', 880, 880, .16, .12, .09); break;
    }
  } catch (e) { /* audio is optional */ }
}
function toggleSound() {
  S.on = !S.on;
  try { localStorage.setItem('hellscan.sound', S.on ? '1' : '0'); } catch (e) { /* storage blocked */ }
  if (S.on) { S.unlock(); snd('menu'); }
}

// ---------- leaderboard (stored on this device, shared by everyone who plays on it) ----------
// hellscan.best: { NAME: { s, l, k, d, t, games, last } }  - each player's best game, for the all-time board
// hellscan.games: [ { n, s, l, k, d, t } ]                 - recent games, for the weekly board
// hellscan.players: { NAME: lastPlayedTime }                - for the "who's playing?" list
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); const o = v ? JSON.parse(v) : d; return o && typeof o === typeof d && Array.isArray(o) === Array.isArray(d) ? o : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage blocked */ } },
};
let BEST = null, GAMES = null, PLAYERS = null;
function loadBoard() {
  if (BEST) return;
  BEST = store.get('hellscan.best', {}); GAMES = store.get('hellscan.games', []); PLAYERS = store.get('hellscan.players', {});
}
function recentPlayers() { loadBoard(); return Object.keys(PLAYERS).sort((a, b) => PLAYERS[b] - PLAYERS[a]); }
function touchPlayer(name) { loadBoard(); PLAYERS[name] = Date.now(); store.set('hellscan.players', PLAYERS); }
function bestOf(name) { loadBoard(); const b = BEST[name]; return b && b.s >= 0 ? b : null; }
function weekStart() { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d.getTime(); }
function boardRows(tab) {
  loadBoard();
  if (tab === 'week') {
    const ws = weekStart(), m = {};
    for (const g of GAMES) {
      if (g.t < ws) continue;
      const r = m[g.n] || (m[g.n] = { n: g.n, s: -1, l: 0, d: 1, games: 0 });
      r.games++;
      if (g.s > r.s) { r.s = g.s; r.l = g.l; r.d = g.d; }
    }
    return Object.values(m).sort((a, b) => b.s - a.s);
  }
  return Object.keys(BEST).filter(n => BEST[n].s >= 0).map(n => ({ n, s: BEST[n].s, l: BEST[n].l, d: BEST[n].d, games: BEST[n].games || 0 })).sort((a, b) => b.s - a.s);
}
function recordGame() {
  loadBoard();
  const name = G.player || 'PLAYER', now = Date.now();
  GAMES.push({ n: name, s: G.score, l: G.n, k: G.kills, d: G.diff, t: now });
  if (GAMES.length > 500) GAMES.splice(0, GAMES.length - 500);
  const b = BEST[name] || { s: -1, games: 0 }, prev = b.s;
  b.games = (b.games || 0) + 1; b.last = now;
  if (G.score > prev) { b.s = G.score; b.l = G.n; b.k = G.kills; b.d = G.diff; b.t = now; }
  BEST[name] = b;
  store.set('hellscan.best', BEST); store.set('hellscan.games', GAMES);
  touchPlayer(name);
  const rows = boardRows('all'), rank = rows.findIndex(r => r.n === name) + 1;
  return { first: prev < 0, pb: prev >= 0 && G.score > prev, prev, best: b.s, rank, of: rows.length, above: rank > 1 ? rows[rank - 2] : null };
}

// ---------- boot ----------
function resize() {
  const cw = Math.max(1, window.innerWidth), ch = Math.max(1, window.innerHeight);
  dpr = window.devicePixelRatio || 1;
  H = RES;
  W = clamp(Math.round(H * cw / ch), 200, 640) & ~1;
  view.width = W; view.height = H;
  vctx.imageSmoothingEnabled = false;
  img = vctx.createImageData(W, H); buf = new Uint32Array(img.data.buffer); zbuf = new Float32Array(W);
  over.width = Math.round(cw * dpr); over.height = Math.round(ch * dpr);
  kx = over.width / W; ky = over.height / H;
  minMod = Math.max(1, Math.round(MOD_CSS * dpr));
  maxMod = Math.max(minMod, Math.round(MOD_CSS * 2 * dpr));
  const half = Math.atan(.5 * W / (H - SBH)), tagAng = (MODS * minMod / kx) / W * 2 * half;
  MINSEP = clamp(tagAng * 1.2, .09, .4);
  G.maxB = Math.max(.25, half - tagAng * .6 - .05);
  buildStatusBar();
}
let last = performance.now(), fps = 0, fpsN = 0, fpsT = 0, ms = 0, msAcc = 0;
function loop(now) {
  requestAnimationFrame(loop);
  let dt = (now - last) / 1000;
  last = now;
  if (!(dt > 0)) dt = 0;
  if (dt > .05) dt = .05;
  const t0 = performance.now();
  try { update(dt); draw(); } catch (e) { $('err').textContent = 'Error: ' + (e && e.stack || e); throw e; }
  msAcc += performance.now() - t0;
  fpsN++; fpsT += dt;
  if (fpsT >= 1) { fps = fpsN; ms = Math.round(msAcc / fpsN * 10) / 10; fpsN = 0; fpsT = 0; msAcc = 0; }
}
try { if (localStorage.getItem('hellscan.sound') === '0') S.on = false; } catch (e) { /* storage blocked */ }
buildTextures();
buildSprites();
resize();
window.addEventListener('resize', resize);
toTitle();
focusScan();
requestAnimationFrame(loop);
window.HELLSCAN = { G, scan: onScan, codes: () => G.targets.map(t => t.code.text), targets: () => G.targets.map(t => ({ code: t.code.text, kind: t.kind, label: t.label || (t.ref && (t.ref.type || t.ref.kind)) || '', cls: t.ref && t.ref.cls, state: t.ref && t.ref.state, d: t.ref && t.ref.scr ? t.ref.scr.ty : 99 })), perf: () => ({ fps, ms }), test: { openLoot, applyItem, dropCrate, hurt, ITEMS } };
})();
