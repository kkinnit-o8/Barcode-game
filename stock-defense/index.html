<script>
(function () {
'use strict';

/* =====================================================================
   STOCK DEFENSE - a Bloons-style tower defense for the Scanner Games arcade.
   The groceries came alive and ride the conveyor belt to the exit without
   paying. Build scanners next to the belt to scan them all.
   Scanner-only: every pad, menu entry and button is a Code 128 barcode.
   URL options: ?module=2  ?digits=4  ?nofs  ?debug  ?speed=N (debug only)
   ===================================================================== */

// ---------- settings ----------
const Q = new URLSearchParams(location.search);
const DEBUG = Q.has('debug');
let DIGITS = parseInt(Q.get('digits'), 10);
if (!(DIGITS >= 4 && DIGITS <= 12)) DIGITS = 4;
if (DIGITS % 2) DIGITS += 1;
const MOD_CSS = Math.max(1, parseFloat(Q.get('module')) || 2);
const SIMSPEED = DEBUG ? Math.max(1, parseFloat(Q.get('speed')) || 1) : 1;
const NO_FS = Q.has('nofs');
const QZ = 8;

// ---------- utils ----------
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const C = hexc;
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

// ---------- 5x7 bitmap font ----------
const FONT = {};
(function () {
  const s = "AehhvhhhBuhhuhhuCehgggheDuhhhhhuEvgguggvFvggugggGehgnhhfHhhhvhhhIe44444eJ72222icKhikokihLggggggvMhrllhhhNhhpljhhOehhhhhePuhhugggQehhhlidRuhhukihSfgge11uTv444444UhhhhhheVhhhhha4WhhhlllaXhha4ahhYhhha444Zv1248gv0ehjlphe14c4444e2eh1248v3v2421he426aiv225vgu11he668guhhe7v1248888ehhehhe9ehhf12c 0000000.00000cc,0000c48!4444404?eh12404:0cc0cc0-000v000+044v440%op248j3/01248g0'4480000(2488842)8422248#aavavaa>8421248<248g842=00v0v00*0level0_000000v$4fke5u4";
  const d = '0123456789abcdefghijklmnopqrstuv';
  for (let i = 0; i + 8 <= s.length; i += 8) { const g = []; for (let r = 1; r < 8; r++) g.push(d.indexOf(s[i + r])); FONT[s[i]] = g; }
})();
const TC = new Map();
function textCanvas(str, sc, color, shadow) {
  const key = str + '\u0001' + sc + color + (shadow || '');
  let c = TC.get(key);
  if (c) return c;
  const n = str.length;
  c = mk(Math.max(1, n * 6 * sc - sc) + (shadow ? sc : 0), 7 * sc + (shadow ? sc : 0));
  const g = c.getContext('2d');
  const pass = (ox, oy) => {
    for (let i = 0; i < n; i++) {
      const gl = FONT[str[i]] || FONT['?'];
      for (let r = 0; r < 7; r++) { const row = gl[r]; if (!row) continue; for (let b = 0; b < 5; b++) if (row & (16 >> b)) g.fillRect(ox + (i * 6 + b) * sc, oy + r * sc, sc, sc); }
    }
  };
  if (shadow) { g.fillStyle = shadow; pass(sc, sc); }

    const cs = color.slice(5).split(','), gr = g.createLinearGradient(0, 0, 0, 7 * sc);
    cs.forEach((cc, i) => gr.addColorStop(i / (cs.length - 1), cc));
    g.fillStyle = gr;
  } else g.fillStyle = color;

  return c;
}
function txt(g, str, x, y, sc = 1, color = '#fff', align = 'left', shadow = '#000') {

  const c = textCanvas(str, sc, color, shadow);
  const dx = align === 'center' ? x - (c.width >> 1) : align === 'right' ? x - c.width : x;
  g.drawImage(c, Math.round(dx), Math.round(y));

}

  const maxC = Math.max(4, Math.floor((maxW + sc) / (6 * sc))), lines = [];

    if (cur && cur.length + 1 + w.length > maxC) { lines.push(cur); cur = w; } else cur = cur ? cur + ' ' + w : w;
  }
  if (cur) lines.push(cur);

}

// ---------- Code 128 (set C, digits only) ----------
const C128 = ('212222 222122 222221 121223 121322 131222 122213 122312 132212 221213 ' +
  '221312 231212 112232 122132 122231 113222 123122 123221 223211 221132 ' +
  '221231 213212 223112 312131 311222 321122 321221 312212 322112 322211 ' +
  '212123 212321 232121 111323 131123 131321 112313 132113 132311 211313 ' +
  '231113 231311 112133 112331 132131 113123 113321 133121 313121 211331 ' +
  '231131 213113 213311 213131 311123 311321 331121 312113 312311 332111 ' +
  '314111 221411 431111 111224 111422 121124 121421 141122 141221 112214 ' +
  '112412 122114 122411 142112 142211 241211 221114 413111 241112 134111 ' +
  '111242 121142 121241 114212 124112 124211 411212 421112 421211 212141 ' +
  '214121 412121 111143 111341 131141 114113 114311 411113 411311 113141 ' +
  '114131 311141 411131 211412 211214 211232 2331112').split(' ');
function makeCode(text) {

  for (let i = 0; i < text.length; i += 2) v.push(parseInt(text.substr(i, 2), 10));
  let s = 105;
  for (let i = 1; i < v.length; i++) s += v[i] * i;
  v.push(s % 103, 106);

  for (const val of v) {

// Every control has a fixed code: 1xxx map pads, 2xxx build menu, 3xxx tower menu, 4xxx game controls, 9xxx menus.
const ccache = {};

// ---------- canvases ----------
const view = $('view'), vctx = view.getContext('2d', { alpha: false });

const W = 480, H = 270, HUD = 36;  // low-res screen; the map fills it, under a status bar HUD px tall

// ---------- pixel painter ----------
const prng = mulberry32(7);
class Pix {
  constructor(w, h) { this.w = w; this.h = h; this.d = new Uint32Array(w * h); }

  get(x, y) { return (x >= 0 && y >= 0 && x < this.w && y < this.h) ? this.d[y * this.w + x] : 0; }
  rect(x, y, w, h, c) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.set(x + i, y + j, c); return this; }
  ell(cx, cy, rx, ry, c) {
    for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) {
      const dx = (x + .5 - cx) / rx, dy = (y + .5 - cy) / ry;

    }

  }

    for (const p of pts) { x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]); }
    for (let y = Math.floor(y0); y <= Math.ceil(y1); y++) for (let x = Math.floor(x0); x <= Math.ceil(x1); x++) {
      const px = x + .5, py = y + .5;
      let ins = false;
      for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
        const a = pts[i], b = pts[j];
        if ((a[1] > py) !== (b[1] > py) && px < (b[0] - a[0]) * (py - a[1]) / (b[1] - a[1]) + a[0]) ins = !ins;
      }
      if (ins) this.set(x, y, c);
    }

  }
  line(x0, y0, x1, y1, c, t = 1) {
    const n = Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) * 2) + 1;
    for (let i = 0; i <= n; i++) this.rect(Math.round(x0 + (x1 - x0) * i / n - t / 2), Math.round(y0 + (y1 - y0) * i / n - t / 2), t, t, c);
    return this;
  }

    for (let y = 0; y < this.h; y++) for (let x = 0; x < w; x++) {
      const c = this.d[y * w + x];
      if (!c) continue;
      if (!this.get(x - 1, y) || !this.get(x + 1, y) || !this.get(x, y - 1) || !this.get(x, y + 1)) o[y * w + x] = cmul(c, f);
    }

  }

  }
}
function glyph(p, ch, x, y, c) { const g = FONT[ch]; if (g) for (let r = 0; r < 7; r++) for (let b = 0; b < 5; b++) if (g[r] & (16 >> b)) p.set(x + b, y + r, c); }

  const Wh = C('#ffffff'), K = C('#111111');
  p.rect(x, y, 2, 2, Wh); p.rect(x + gap, y, 2, 2, Wh); p.set(x + 1, y + 1, K); p.set(x + gap, y + 1, K);
  if (mad) { p.set(x - 1, y - 1, K); p.set(x, y - 1, K); p.set(x + gap + 1, y - 1, K); p.set(x + gap + 2, y - 1, K); }
}

// ---------- the groceries (enemies). Scanning one peels a layer, like popping a balloon ----------
// speed: multiplier of BASE; child/n: what it turns into; hp: tough items (crate, pallet, cart)
const BASE = 28;
const IT = {

  candy: { name: 'CANDY', speed: 1.4, r: 5, child: 'gum', col: '#3d7bff' },
  soda: { name: 'SODA', speed: 1.8, r: 5, child: 'candy', col: '#2fbf4a' },
  chips: { name: 'CHIPS', speed: 3.2, r: 5, child: 'soda', col: '#ffd43b' },
  energy: { name: 'ENERGY DRINK', speed: 3.5, r: 5, child: 'chips', col: '#e0409a' },
  twin: { name: 'TWIN PACK', speed: 1.8, r: 6, child: 'energy', n: 2, col: '#55555c' },
  pizza: { name: 'FROZEN PIZZA', speed: 2.0, r: 6, child: 'energy', n: 2, noFreeze: true, col: '#e8f0ff' },
  smudged: { name: 'SMUDGED BOX', speed: 1.0, r: 6, child: 'twin', n: 2, smudged: true, col: '#a0703c' },
  multi: { name: 'MULTIPACK', speed: 1.8, r: 6, kids: ['twin', 'pizza'], col: '#dddddd' },

};
const PARENT = { gum: 'candy', candy: 'soda', soda: 'chips', chips: 'energy' };
const ORDER = Object.keys(IT);

ORDER.forEach(rbe);

let sbuf = '', sTimer = 0, sMatchEnd = -1;
function activeHas(s) { for (const t of G.targets) if (t.code.text === s) return true; return false; }
function feed(ch) {
  sbuf += ch;
  if (sbuf.length > 64) { sMatchEnd -= sbuf.length - 64; sbuf = sbuf.slice(-64); }
  const tail = sbuf.slice(-DIGITS);
  if (sbuf.length - Math.max(0, sMatchEnd) >= DIGITS && activeHas(tail)) { sMatchEnd = sbuf.length; onScan(tail); }
  clearTimeout(sTimer);
  sTimer = setTimeout(flush, DEBUG ? 4000 : 450);
}
function flush() {
  clearTimeout(sTimer);
  const s = sMatchEnd < 0 ? sbuf : '';
  sbuf = ''; sMatchEnd = -1;
  if (s) onScan(s);
}
function onScan(raw) {
  const s = String(raw).replace(/[^0-9A-Za-z]/g, '');
  if (!s) return;
  S.unlock();
  G.idleT = 0;
  let t = null;
  for (const x of G.targets) if (x.code.text === s) { t = x; break; }
  if (!t) for (const x of G.targets) if (s.indexOf(x.code.text) >= 0) { t = x; break; }

}
function keyChar(e) {

document.addEventListener('keydown', e => {
  S.unlock();
  const k = e.keyCode || e.which || 0;
  if (e.key === 'Escape' || k === 27) {
    if (G.mode === 'play' && G.sel !== null) G.sel = null;
    else if (G.mode === 'play') { G.prevMode = 'play'; setMode('paused'); }
    else if (G.mode === 'paused') setMode('play');
    else if (G.mode === 'title') toArcade();
    else if (G.mode === 'name') { if (recentPlayers().length) setMode('who'); else toTitle(); }
    else if (G.mode !== 'won') toTitle();

  }
  if (e.key === 'Enter' || e.key === 'Tab' || k === 13 || k === 9) { e.preventDefault(); flush(); return; }

}, true);
scanEl.addEventListener('input', () => {
  const v = scanEl.value;
  scanEl.value = '';
  for (const ch of v) { if (ch === '\n' || ch === '\r' || ch === '\t') flush(); else feed(ch); }
});
function focusScan() { if (document.activeElement !== scanEl) { try { scanEl.focus({ preventScroll: true }); } catch (e) { /* ignore */ } } }
scanEl.addEventListener('blur', () => setTimeout(focusScan, 0));
setInterval(focusScan, 1500);
window.addEventListener('pointerdown', e => {  // tapping a barcode works too (touchscreen convenience)
  S.unlock(); focusScan();
  const x = e.clientX * dpr, y = e.clientY * dpr;
  for (let i = G.targets.length - 1; i >= 0; i--) {
    const t = G.targets[i], r = t.rect;
    if (x >= r[0] && y >= r[1] && x < r[0] + r[2] && y < r[1] + r[3]) { onScan(t.code.text); break; }
  }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && G.mode === 'play') { G.prevMode = 'play'; setMode('paused'); } });
function goFull() {
  if (NO_FS) return;
  try { const d = document.documentElement; if (!document.fullscreenElement && d.requestFullscreen) d.requestFullscreen({ navigationUI: 'hide' }).catch(() => {}); } catch (e) { /* not supported */ }
}

// ---------- sound ----------
const S = {
  ctx: null, out: null, nb: null, on: true,
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      this.ctx = new AC(); this.out = this.ctx.createGain(); this.out.gain.value = .4;
      const comp = this.ctx.createDynamicsCompressor(); this.out.connect(comp); comp.connect(this.ctx.destination);
      const len = this.ctx.sampleRate | 0; this.nb = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.nb.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { this.ctx = null; }
  },
  unlock() { this.init(); if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); },
  tone(type, f0, f1, dur, vol, del = 0) {
    const c = this.ctx, t = c.currentTime + del, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g); g.connect(this.out); o.start(t); o.stop(t + dur + .02);
  },
  noise(dur, vol, ft, f0, f1, del = 0) {
    const c = this.ctx, t = c.currentTime + del, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.nb; s.loop = true; f.type = ft; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.out); s.start(t, Math.random() * .5); s.stop(t + dur + .02);
  },
};
function snd(n) {
  if (!S.on || !S.ctx || S.ctx.state !== 'running') return;
  try {
    switch (n) {
      case 'beep': S.tone('square', 1800, 1800, .05, .05); break;
      case 'zap': S.tone('sawtooth', 1400, 500, .06, .03); break;
      case 'price': S.tone('square', 600, 300, .06, .06); S.noise(.05, .08, 'highpass', 3000, 2000); break;
      case 'throw': S.noise(.12, .08, 'bandpass', 800, 300); break;
      case 'boom': S.noise(.35, .35, 'lowpass', 1200, 80); S.tone('sine', 90, 35, .3, .25); break;
      case 'freeze': S.tone('sine', 2200, 900, .25, .05); break;
      case 'alarm': S.tone('square', 900, 700, .3, .08); S.tone('square', 900, 700, .3, .08, .32); break;
      case 'build': S.tone('square', 440, 880, .1, .12); S.noise(.08, .1, 'lowpass', 2000, 300); break;
      case 'upgrade': [523, 659, 784].forEach((f, i) => S.tone('square', f, f, .08, .1, i * .06)); break;
      case 'sell': S.tone('triangle', 1200, 600, .15, .12); break;
      case 'menu': S.tone('square', 880, 1320, .08, .12); break;
      case 'buzz': S.tone('sawtooth', 110, 100, .2, .16); break;
      case 'leak': S.tone('sawtooth', 300, 120, .25, .15); break;
      case 'start': S.tone('square', 660, 990, .12, .12); break;
      case 'round': [784, 988, 1175].forEach((f, i) => S.tone('square', f, f, .09, .1, i * .07)); break;
      case 'win': [523, 659, 784, 1046, 1318].forEach((f, i) => S.tone('square', f, f, .14, .12, i * .1)); break;
      case 'lose': S.tone('sawtooth', 300, 60, 1.2, .25); break;
    }
  } catch (e) { /* audio is optional */ }
}
function beep(tier) { if (G.t - G.lastBeep < .05) return; G.lastBeep = G.t; if (!S.on || !S.ctx || S.ctx.state !== 'running') return; try { S.tone('square', 1500 + tier * 300, 1500 + tier * 300, .04, .04); } catch (e) { /* optional */ } }
function zap() { if (G.t - G.lastZap < .08) return; G.lastZap = G.t; snd('zap'); }
function toggleSound() { S.on = !S.on; try { localStorage.setItem('stockdef.sound', S.on ? '1' : '0'); } catch (e) { /* storage blocked */ } if (S.on) { S.unlock(); snd('menu'); } }

// ---------- leaderboard (this device). Players are shared with the other Scanner Games ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); const o = v ? JSON.parse(v) : d; return o && typeof o === typeof d && Array.isArray(o) === Array.isArray(d) ? o : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage blocked */ } },
};
let BEST = null, GAMES = null, PLAYERS = null;
function loadBoard() { if (BEST) return; BEST = store.get('stockdef.best', {}); GAMES = store.get('stockdef.games', []); PLAYERS = store.get('hellscan.players', {}); }
function recentPlayers() { loadBoard(); return Object.keys(PLAYERS).sort((a, b) => PLAYERS[b] - PLAYERS[a]); }
function touchPlayer(name) { loadBoard(); PLAYERS = store.get('hellscan.players', {}); PLAYERS[name] = Date.now(); store.set('hellscan.players', PLAYERS); }
function bestOf(name) { loadBoard(); return BEST[name] || null; }
function weekStart() { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d.getTime(); }
const better = (a, b) => a.r !== b.r ? a.r > b.r : a.s > b.s;
function boardRows(tab) {
  loadBoard();
  let rows;
  if (tab === 'week') {
    const ws = weekStart(), m = {};
    for (const g of GAMES) {
      if (g.t < ws) continue;
      const r = m[g.n] || (m[g.n] = { n: g.n, r: -1, s: -1, d: 1, games: 0 });
      r.games++;
      if (better(g, r)) { r.r = g.r; r.s = g.s; r.d = g.d; }
    }
    rows = Object.values(m);
  } else rows = Object.keys(BEST).map(n => ({ n, r: BEST[n].r, s: BEST[n].s, d: BEST[n].d, games: BEST[n].games || 0 }));
  return rows.sort((a, b) => b.r - a.r || b.s - a.s);
}
function recordGame() {
  loadBoard();
  // A game is saved when it ends, and again when freeplay after a win ends: the second save updates the same entry.
  const name = G.player || 'PLAYER', now = Date.now(), again = !!G.rec, e = G.rec || (G.rec = { n: name, d: G.diff });
  e.r = G.cleared; e.s = score(); e.t = now;
  if (!again) { GAMES.push(e); if (GAMES.length > 500) GAMES.splice(0, GAMES.length - 500); }
  const prev = BEST[name], b = prev ? Object.assign({}, prev) : { r: -1, s: -1, games: 0 };
  if (!again) b.games = (b.games || 0) + 1;
  b.last = now;
  const pb = !prev || better(e, prev);
  if (pb) { b.r = e.r; b.s = e.s; b.d = e.d; b.t = now; }
  BEST[name] = b;
  store.set('stockdef.best', BEST); store.set('stockdef.games', GAMES);
  touchPlayer(name);
  const rows = boardRows('all'), rank = rows.findIndex(r => r.n === name) + 1;
  return { first: !prev, pb: !!prev && pb, bestR: b.r, rank, of: rows.length, above: rank > 1 ? rows[rank - 2] : null };
}

// ---------- boot ----------
function resize() {
  const cw = Math.max(1, window.innerWidth), ch = Math.max(1, window.innerHeight);
  dpr = window.devicePixelRatio || 1;
  view.width = W; view.height = H;
  vctx.imageSmoothingEnabled = false;
  // Square pixels: scale evenly and letterbox what is left (bars above and below on 4:3 and 16:10 screens).
  const k = Math.min(cw / W, ch / H), vw = W * k, vh = H * k, left = Math.round((cw - vw) / 2), top = Math.round((ch - vh) / 2);
  view.style.width = vw + 'px'; view.style.height = vh + 'px'; view.style.left = left + 'px'; view.style.top = top + 'px';
  over.width = Math.round(cw * dpr); over.height = Math.round(ch * dpr);
  kx = ky = k * dpr; OX = left * dpr; OY = top * dpr;
  minMod = Math.max(1, Math.round(MOD_CSS * dpr));
}
let last = performance.now(), fps = 0, fpsN = 0, fpsT = 0, msAvg = 0, msAcc = 0;
function loop(now) {

  last = now;
  if (!(dt > 0)) dt = 0;
  if (dt > .05) dt = .05;
  const t0 = performance.now();
  try { update(dt); draw(); } catch (e) { $('err').textContent = 'Error: ' + (e && e.stack || e); throw e; }
  msAcc += performance.now() - t0;
  fpsN++; fpsT += dt;
  if (fpsT >= 1) { fps = fpsN; msAvg = Math.round(msAcc / fpsN * 10) / 10; fpsN = 0; fpsT = 0; msAcc = 0; }
}
try { if (localStorage.getItem('stockdef.sound') === '0') S.on = false; } catch (e) { /* storage blocked */ }
for (const k of ORDER) ISPR[k] = drawItem(k);
for (const T of TOWERS) TSPR[T.id] = drawTowerHead(T.id);
TSPR.handheldg = drawTowerHead('handheld', true);
mapCanvas = buildMap();
resize();
window.addEventListener('resize', resize);
toTitle();
focusScan();
requestAnimationFrame(loop);
window.STOCKDEF = {
  G, scan: onScan, perf: () => ({ fps, ms: msAvg, items: items.length }),
  targets: () => G.targets.map(t => ({ code: t.code.text, label: t.label || '' })),
  state: () => ({ mode: G.mode, round: G.round, wave: G.wave, lives: G.lives, cash: Math.floor(G.cash), towers: towers.map(t => t && { k: TOWERS[t.k].id, a: t.a, b: t.b, pops: t.pops }), items: items.length, sel: G.sel }),
  test: { TOWERS, IT, ROUNDS, parseRound, roundDef, rbe, price, SLOTS },

})();
