<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d0a08">
<title>Scanner Games</title>
<meta name="description" content="Arcade games you play with a barcode scanner. Point it at a barcode, pull the trigger, play.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231a1511'/%3E%3Cg fill='%23ffa424'%3E%3Cpath d='M10 12h4v40h-4zM17 12h2v40h-2zM22 12h6v40h-6zM31 12h2v40h-2zM37 12h5v40h-5zM45 12h2v40h-2zM51 12h4v40h-4z'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root {
  --bg: #0d0a08; --panel: #1a1511; --line: #3b3028; --ink: #f4ece2; --muted: #a8998a; --accent: #ffa424; --hot: #e8341c;
  --mono: "Courier New", "Droid Sans Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh; background-color: var(--bg); color: var(--ink); font: 16px/1.45 var(--mono);
  background-image: radial-gradient(ellipse at 50% -10%, rgba(232, 52, 28, .22), transparent 60%), repeating-linear-gradient(0deg, rgba(255, 255, 255, .03) 0 1px, transparent 1px 4px);
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 1120px; margin: 0 auto; padding: 18px 16px 24px; }
header { text-align: center; margin-bottom: 18px; }
h1 { margin: 0; }
.logo { display: block; width: min(680px, 100%); height: auto; margin: 0 auto; }
.stripes {
  height: 10px; width: min(680px, 100%); margin: 12px auto; opacity: .5;
  background: repeating-linear-gradient(90deg, var(--ink) 0 3px, transparent 3px 5px, var(--ink) 5px 6px, transparent 6px 10px, var(--ink) 10px 14px, transparent 14px 16px);
}
.tagline { margin: 0; color: var(--muted); letter-spacing: .14em; text-transform: uppercase; font-weight: 700; font-size: 15px; }
.prompt { margin: 8px 0 0; color: var(--accent); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(380px, 100%), 1fr)); gap: 18px; }
.card {
  position: relative; display: flex; flex-direction: column; background: var(--panel); border: 3px solid var(--line); border-radius: 6px;
  color: inherit; text-decoration: none; box-shadow: 0 6px 0 #000; overflow: hidden; transition: transform .12s, border-color .12s, box-shadow .12s;
}
a.card:hover, a.card:focus-visible, .card.hit { border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 9px 0 #000, 0 0 0 3px rgba(255, 164, 36, .25); outline: none; }
.card.hit { animation: flash .2s 3; }
@keyframes flash { 50% { background: #3a2a14; } }
.shot { display: block; width: 100%; height: 300px; object-fit: cover; object-position: 60% 50%; image-rendering: pixelated; background: #000; border-bottom: 3px solid var(--line); }
.body { display: flex; flex-direction: column; gap: 9px; padding: 12px 16px 14px; flex: 1; min-width: 0; }
.title svg { display: block; height: 34px; width: auto; }
.genre { margin: 0; color: var(--accent); font-weight: 700; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; }
.desc { margin: 0; color: #d9cfc3; font-size: 14px; }
.board { margin: 0; padding: 8px 10px; background: rgba(0, 0, 0, .35); border-radius: 4px; font-size: 13px; color: var(--muted); }
.board strong { color: var(--ink); letter-spacing: .08em; }
.board ol { margin: 4px 0 0; padding: 0; list-style: none; }
.board li { display: flex; justify-content: space-between; gap: 10px; }
.board li:first-child { color: var(--accent); }
.play { display: flex; align-items: center; gap: 16px; padding: 10px 14px; background: #fff; color: #111; border-radius: 4px; }
.play svg { display: block; flex: none; }
.play span { font-weight: 900; font-size: 20px; line-height: 1.2; letter-spacing: .04em; }
.play small { display: block; font-weight: 700; color: #555; letter-spacing: 0; }
.soon { grid-column: 1 / -1; flex-direction: row; align-items: center; justify-content: center; gap: 14px; padding: 12px 20px; border-style: dashed; box-shadow: none; color: var(--muted); }
.soon .q { font-size: 40px; line-height: 1; color: var(--line); font-weight: 900; }
.soon strong { color: var(--ink); letter-spacing: .1em; }
footer { margin-top: 26px; text-align: center; color: var(--muted); font-size: 13px; }
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); padding: 10px 16px; background: #000; border: 2px solid var(--hot);
  color: var(--ink); font-weight: 700; border-radius: 4px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 5;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }
#scan { position: fixed; left: 0; top: 0; width: 2px; height: 2px; opacity: 0; border: 0; padding: 0; margin: 0; background: transparent; color: transparent; caret-color: transparent; font-size: 16px; z-index: -1; }
@media (max-width: 860px) {
  .soon { flex-direction: column; text-align: center; }
  .play { flex-direction: column; text-align: center; gap: 8px; }
}
@media (prefers-reduced-motion: reduce) { .prompt { animation: none; } .card { transition: none; } }
</style>
</head>
<body>
<input id="scan" type="text" inputmode="none" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Scanner input">
<div class="wrap">
  <header>
    <h1 id="logo">SCANNER GAMES</h1>
    <div class="stripes" aria-hidden="true"></div>
    <p class="tagline">Arcade games you play with a barcode scanner</p>
    <p class="prompt">&#9654; Scan a game's barcode or tap it to play</p>
  </header>
  <main class="grid" id="games">
    <noscript><a class="card" href="hellscan/"><div class="body">HELLSCAN - Doom-style shooter</div></a></noscript>
  </main>
  <footer>Made for the SuSoft POS terminal &middot; Works with any barcode scanner in keyboard mode &middot; Scores are saved on this machine</footer>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
(function () {
'use strict';

/* Scanner Games — the arcade home page.
   To add a game: put it in its own folder (e.g. checkout-rush/index.html) and add an entry to GAMES.
   Each game gets a 6-digit Code 128 barcode starting with 71; scanning it (or tapping the card) opens the game. */
const GAMES = [
  {
    name: 'HELLSCAN', url: 'hellscan/', code: '710001', img: 'hellscan/preview.png', color: 'grad:#fff07a,#ff9a10,#d01010',
    genre: 'Doom-style shooter · 1 player',
    desc: 'Demons have invaded the store and every one of them carries a barcode. Scan it to shoot it. Loot crates, a boss on every level and a leaderboard for everyone at work.',
    top: () => topFrom('hellscan.best'),
  },
  {
    name: 'STOCK DEFENSE', url: 'stock-defense/', code: '710002', img: 'stock-defense/preview.png', color: 'grad:#e0ff8a,#58e070,#138a3a',
    genre: 'Tower defense \u00b7 1 player',
    desc: 'The groceries came alive and ride the conveyor belt to the exit without paying. Build and upgrade scanners along the belt to scan them all, from gum to the Cart King.',
    top: () => topRounds('stockdef.best'),
  },
];

// ---------- 5x7 pixel font (same as the games) ----------
const FONT = {};
(function () {
  const s = "AehhvhhhBuhhuhhuCehgggheDuhhhhhuEvgguggvFvggugggGehgnhhfHhhhvhhhIe44444eJ72222icKhikokihLggggggvMhrllhhhNhhpljhhOehhhhhePuhhugggQehhhlidRuhhukihSfgge11uTv444444UhhhhhheVhhhhha4WhhhlllaXhha4ahhYhhha444Zv1248gv0ehjlphe14c4444e2eh1248v3v2421he426aiv225vgu11he668guhhe7v1248888ehhehhe9ehhf12c 0000000.00000cc,0000c48!4444404?eh12404:0cc0cc0-000v000+044v440%op248j3/01248g0'4480000(2488842)8422248#aavavaa>8421248<248g842=00v0v00*0level0_000000v";
  const d = '0123456789abcdefghijklmnopqrstuv';
  for (let i = 0; i + 8 <= s.length; i += 8) { const g = []; for (let r = 1; r < 8; r++) g.push(d.indexOf(s[i + r])); FONT[s[i]] = g; }
})();
let gradId = 0;
function pixelSVG(str, color, shadow, cls) {
  str = str.toUpperCase();
  const w = str.length * 6 - 1;
  let d = '';
  for (let i = 0; i < str.length; i++) {
    const g = FONT[str[i]] || FONT['?'];
    for (let r = 0; r < 7; r++) for (let b = 0; b < 5; b++) if (g[r] & (16 >> b)) d += 'M' + (i * 6 + b) + ' ' + r + 'h1v1h-1z';
  }
  let fill = color, defs = '';
  if (color.startsWith('grad:')) {
    const id = 'pg' + (++gradId), cs = color.slice(5).split(',');
    defs = '<defs><linearGradient id="' + id + '" x1="0" y1="0" x2="0" y2="1">' + cs.map((c, i) => '<stop offset="' + i / (cs.length - 1) + '" stop-color="' + c + '"/>').join('') + '</linearGradient></defs>';
    fill = 'url(#' + id + ')';
  }
  return '<svg class="' + (cls || '') + '" viewBox="0 0 ' + (w + 1) + ' 8" shape-rendering="crispEdges" role="img" aria-label="' + str + '">' + defs +
    (shadow ? '<path transform="translate(.6 .6)" fill="' + shadow + '" d="' + d + '"/>' : '') + '<path fill="' + fill + '" d="' + d + '"/></svg>';
}

// ---------- Code 128, code set C (digits only) ----------
const C128 = ('212222 222122 222221 121223 121322 131222 122213 122312 132212 221213 221312 231212 112232 122132 122231 113222 123122 123221 223211 221132 ' +
  '221231 213212 223112 312131 311222 321122 321221 312212 322112 322211 212123 212321 232121 111323 131123 131321 112313 132113 132311 211313 ' +
  '231113 231311 112133 112331 132131 113123 113321 133121 313121 211331 231131 213113 213311 213131 311123 311321 331121 312113 312311 332111 ' +
  '314111 221411 431111 111224 111422 121124 121421 141122 141221 112214 112412 122114 122411 142112 142211 241211 221114 413111 241112 134111 ' +
  '111242 121142 121241 114212 124112 124211 411212 421112 421211 212141 214121 412121 111143 111341 131141 114113 114311 411113 411311 113141 ' +
  '114131 311141 411131 211412 211214 211232 2331112').split(' ');
function barcodeSVG(text, mod, h) {
  const v = [105];
  for (let i = 0; i < text.length; i += 2) v.push(parseInt(text.substr(i, 2), 10));
  let sum = 105;
  for (let i = 1; i < v.length; i++) sum += v[i] * i;
  v.push(sum % 103, 106);
  const QZ = 8;
  let x = QZ, rects = '';
  for (const val of v) {
    const p = C128[val];
    for (let i = 0; i < p.length; i++) { const w = p.charCodeAt(i) - 48; if (!(i & 1)) rects += '<rect x="' + x * mod + '" width="' + w * mod + '" height="' + h + '"/>'; x += w; }
  }
  const W = (x + QZ) * mod;
  return '<svg width="' + W + '" height="' + h + '" viewBox="0 0 ' + W + ' ' + h + '" shape-rendering="crispEdges" aria-hidden="true"><rect width="' + W + '" height="' + h + '" fill="#fff"/><g fill="#000">' + rects + '</g></svg>';
}

// ---------- leaderboard snippets (games store scores in this browser) ----------
function topFrom(key) {
  try {
    const best = JSON.parse(localStorage.getItem(key) || '{}');
    return Object.keys(best).filter(n => best[n] && best[n].s >= 0).map(n => ({ n, s: best[n].s })).sort((a, b) => b.s - a.s).slice(0, 3);
  } catch (e) { return []; }
}
function topRounds(key) {
  try {
    const best = JSON.parse(localStorage.getItem(key) || '{}');
    return Object.keys(best).filter(n => best[n] && best[n].r >= 0).sort((a, b) => best[b].r - best[a].r || best[b].s - best[a].s).slice(0, 3).map(n => ({ n, s: 'ROUND ' + best[n].r }));
  } catch (e) { return []; }
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ---------- render ----------
document.getElementById('logo').innerHTML = pixelSVG('SCANNER GAMES', 'grad:#fff07a,#ffa424,#e8341c', '#3a0a00', 'logo');
const grid = document.getElementById('games');
grid.innerHTML = GAMES.map((g, i) => {
  const top = g.top ? g.top() : [];
  const board = top.length
    ? '<ol>' + top.map((r, k) => '<li><span>' + (k + 1) + '. ' + esc(r.n) + '</span><span>' + r.s + '</span></li>').join('') + '</ol>'
    : '<div>No scores yet &mdash; be the first!</div>';
  return '<a class="card" href="' + g.url + '" data-i="' + i + '">' +
    '<img class="shot" src="' + g.img + '" alt="' + esc(g.name) + ' screenshot" width="768" height="300">' +
    '<div class="body"><div class="title">' + pixelSVG(g.name, g.color, '#000') + '</div>' +
    '<p class="genre">' + esc(g.genre) + '</p>' +
    '<div class="play">' + barcodeSVG(g.code, 3, 56) + '<span>SCAN TO PLAY<small>or tap this card</small></span></div>' +
    '<p class="desc">' + esc(g.desc) + '</p>' +
    '<div class="board"><strong>TOP PLAYERS</strong>' + board + '</div></div></a>';
}).join('') +
  '<div class="card soon"><div class="q">?</div><div><strong>MORE GAMES COMING</strong><div>New scanner games will show up here.</div></div></div>';

// ---------- scanner input (keyboard-wedge scanners type the code, usually followed by Enter) ----------
const scanEl = document.getElementById('scan'), toastEl = document.getElementById('toast');
let buf = '', timer = 0, toastT = 0, launching = false, actx = null;
function beep(ok) {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = actx || new AC();
    const o = actx.createOscillator(), gn = actx.createGain(), t = actx.currentTime;
    o.type = 'square'; o.frequency.value = ok ? 1320 : 180;
    gn.gain.setValueAtTime(.12, t); gn.gain.exponentialRampToValueAtTime(.001, t + (ok ? .12 : .25));
    o.connect(gn); gn.connect(actx.destination); o.start(t); o.stop(t + .3);
  } catch (e) { /* sound is optional */ }
}
function toast(text) {
  toastEl.textContent = text; toastEl.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('on'), 2200);
}
function find(s) {  // exact match on the end of the scan first, then anywhere (scanners may add prefixes or suffixes)
  const i = GAMES.findIndex(g => s.slice(-g.code.length) === g.code);
  return i >= 0 ? i : GAMES.findIndex(g => s.indexOf(g.code) >= 0);
}
function launch(i) {
  if (launching) return;
  launching = true;
  beep(true);
  const card = grid.querySelector('[data-i="' + i + '"]');
  if (card) card.classList.add('hit');
  setTimeout(() => { location.href = GAMES[i].url; }, 350);
}
function feed(ch) {
  buf += ch;
  if (buf.length > 64) buf = buf.slice(-64);
  const i = GAMES.findIndex(g => buf.slice(-g.code.length) === g.code);
  if (i >= 0) { buf = ''; clearTimeout(timer); launch(i); return; }
  clearTimeout(timer);
  timer = setTimeout(flush, 450);
}
function flush() {
  clearTimeout(timer);
  const s = buf.replace(/[^0-9A-Za-z]/g, '');
  buf = '';
  if (!s) return;
  const i = find(s);
  if (i >= 0) launch(i); else { beep(false); toast('Unknown barcode: ' + s); }
}
document.addEventListener('keydown', e => {
  const k = e.keyCode || e.which || 0;
  if (e.key === 'Enter' || e.key === 'Tab' || k === 13 || k === 9) { if (buf) { e.preventDefault(); flush(); } return; }
  if (k === 229 || e.key === 'Unidentified' || e.key === 'Process' || e.ctrlKey || e.altKey || e.metaKey) return;
  let ch = e.key && e.key.length === 1 ? e.key : '';
  if (!ch && k >= 48 && k <= 57) ch = String.fromCharCode(k);
  if (!ch && k >= 96 && k <= 105) ch = String.fromCharCode(k - 48);
  if (ch && /[0-9A-Za-z\]]/.test(ch)) { e.preventDefault(); feed(ch); }
}, true);
scanEl.addEventListener('input', () => {
  const v = scanEl.value;
  scanEl.value = '';
  for (const ch of v) { if (ch === '\n' || ch === '\r' || ch === '\t') flush(); else feed(ch); }
});
function focusScan() {
  const a = document.activeElement;
  if (a !== scanEl && (!a || a === document.body)) { try { scanEl.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
}
scanEl.addEventListener('blur', () => setTimeout(focusScan, 0));
setInterval(focusScan, 1500);
focusScan();
window.addEventListener('pageshow', () => { launching = false; const h = grid.querySelector('.hit'); if (h) h.classList.remove('hit'); });
window.SCANNER_GAMES = { GAMES, scan: s => { for (const ch of s) feed(ch); flush(); } };
})();
</script>
</body>
</html>
