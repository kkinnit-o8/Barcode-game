// ---------- sound ----------
const S = {
  ctx: null, out: null, nb: null, on: true, eng: null,

  tone(type, f0, f1, dur, vol, del = 0) {

function snd(n) {
  if (!S.on || !S.ctx || S.ctx.state !== 'running') return;
  try {
    switch (n) {
      case 'menu': S.tone('square', 880, 1320, .08, .12); break;
      case 'buzz': S.tone('sawtooth', 110, 100, .2, .16); break;
      case 'join': [523, 784, 1046].forEach((f, i) => S.tone('square', f, f, .08, .1, i * .07)); break;
      case 'start': S.tone('square', 660, 990, .12, .12); break;
      case 'count': S.tone('square', 440, 440, .15, .14); break;
      case 'go': S.tone('square', 880, 880, .35, .16); break;
      case 'level': [659, 784, 988, 1318].forEach((f, i) => S.tone('square', f, f, .09, .1, i * .07)); break;
      case 'pass': [784, 1046].forEach((f, i) => S.tone('square', f, f, .1, .1, i * .08)); break;
      case 'whoosh': if (G.t - G.lastBeep > .12) { G.lastBeep = G.t; S.noise(.25, .12, 'bandpass', 1800, 500); } break;

function toggleSound() { S.on = !S.on; try { localStorage.setItem('rushhour.sound', S.on ? '1' : '0'); } catch (e) { /* storage blocked */ } if (S.on) { S.unlock(); snd('menu'); } else S.engine(0); }

// ---------- leaderboard (this device). Players are shared with the other Scanner Games ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); const o = v ? JSON.parse(v) : d; return o && typeof o === typeof d && Array.isArray(o) === Array.isArray(d) ? o : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage blocked */ } },
  raw(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
  rawSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage blocked */ } },
};
let BEST = null, RACES = null, PLAYERS = null;
function loadBoard() { if (BEST) return; BEST = store.get('rushhour.best', {}); RACES = store.get('rushhour.games', []); PLAYERS = store.get('hellscan.players', {}); }
function touchPlayer(name) { loadBoard(); PLAYERS = store.get('hellscan.players', {}); PLAYERS[name] = Date.now(); store.set('hellscan.players', PLAYERS); }
function bestOf(name) { loadBoard(); return BEST[name] || null; }
function weekStart() { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d.getTime(); }
function boardRows(tab) {
  loadBoard();
  let rows;
  if (tab === 'week') {
    const ws = weekStart(), m = {};
    for (const g of RACES) {
      if (g.t < ws) continue;
      const r = m[g.n] || (m[g.n] = { n: g.n, s: -1, v: 0, games: 0 });
      r.games++;
      if (g.s > r.s) { r.s = g.s; r.v = g.v; }
    }
    rows = Object.values(m);
  } else rows = Object.keys(BEST).map(n => ({ n, s: BEST[n].s, v: BEST[n].v || 0, games: BEST[n].games || 0 }));
  return rows.sort((a, b) => b.s - a.s);
}
function recordGame() {
  loadBoard();
  const name = G.player || 'PLAYER', now = Date.now(), e = { n: name, s: Math.floor(G.dist), v: G.top, t: now };
  RACES.push(e);
  if (RACES.length > 500) RACES.splice(0, RACES.length - 500);
  const prev = BEST[name], b = prev ? Object.assign({}, prev) : { s: -1, v: 0, games: 0 };
  b.games = (b.games || 0) + 1; b.last = now;
  const pb = !prev || e.s > prev.s;
  if (pb) { b.s = e.s; b.v = e.v; b.t = now; }

  const rows = boardRows('all'), rank = rows.findIndex(r => r.n === name) + 1;

// ---------- boot ----------
function resize() {
  const cw = Math.max(1, window.innerWidth), ch = Math.max(1, window.innerHeight);
  dpr = window.devicePixelRatio || 1;
  view.width = W; view.height = H;
  vctx.imageSmoothingEnabled = false;
  // Square pixels: scale evenly and letterbox what is left (bars above and below on 4:3 and 16:10 screens).
  const k = Math.min(cw / W, ch / H), vw = W * k, vh = H * k, left = Math.round((cw - vw) / 2), top = Math.round((ch - vh) / 2);
  view.style.width = vw + 'px'; view.style.height = vh + 'px'; view.style.left = left + 'px'; view.style.top = top + 'px';
  over.width = Math.round(cw * dpr); over.height = Math.round(ch * dpr);

}

{
